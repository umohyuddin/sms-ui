variables:
  IMAGE_NAME: "${CI_REGISTRY_IMAGE}/build:${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}-${TIME_TOKEN}"
  IMAGE_NAME_BRANCH: "${CI_REGISTRY_IMAGE}/build:${CI_COMMIT_BRANCH}-${CI_COMMIT_SHA}"

include:
  - project: 'cim/ci-templates'
    ref: 'main'
    file:
      - trivy.yaml
      - grype.yaml
      - trivy-merge.yaml
      - grype-merge.yaml
      - build_time.yml
      # uncomment if need to publish to dockerhub
      #      - dockerhub-publish.yaml
      - gitlab-publish.yaml
stages:
  - test
  - code_format
  - init
  - artifacts
  - sonarqube-scan
  - build-gitlab
  - scan
  - publish_dockerhub

#+==================Runs on Every Commit and merge requests========================+

node-test:
  stage: test
  image: node:18-bookworm
  before_script:
    - apt-get update && apt-get install -y chromium
    - export CHROME_BIN=$(which chromium)
  script:
    - npm ci
    - npx ng test --browsers ChromeHeadlessNoSandbox --watch=false
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules
      - coverage
  artifacts:
    paths:
      - coverage
      - node_modules/
  only:
    refs:
      - /^.+_f-.+$/   
      - /^.+_b-.+$/   
      - merge_requests
  allow_failure: false


#+==================Runs on Every Commit and merge requests========================+

node-format:
  stage: code_format
  when: on_success
  image: node:18-bookworm
  script:
    - npm ci
    - npm run format:check

  allow_failure: true
  only:
    - /^.+_f-.+$/
    - /^.+_b-.+$/
    - merge_requests
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules
    policy: pull

#+==================Runs everytime========================+

time_build:
  extends: .build_time
  stage: init
  when: on_success
  only:
    - /^.+_f-.+$/
    - /^.+_b-.+$/
    - merge_requests
    - tags

#+==================Runs on Every Commit ========================+
node_artifacts:
  stage: artifacts
  when: on_success
  image: node:18-bookworm
  script:
    - npm ci
    - export TIME_TOKEN="$(cat .ci_status/ci_time)"
    - echo "${TIME_TOKEN}"
    - rm -rf node_modules/.sonar
  artifacts:
    name: "$CI_PROJECT_TITLE"
    paths:
      - $CI_PROJECT_DIR
      - .ci_status/
  allow_failure: false
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules
    policy: pull
  only:
    - /^.+_f-.+$/
    - /^.+_b-.+$/
    - merge_requests
    - tags

#+==================Runs on branches and merge requests ========================+

sonarqube-test:
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  stage: sonarqube-scan
  when: manual
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
    SONAR_HOST_URL: "http://sonarqube-live.expertflow.com"
    SONAR_TOKEN: "${SONAR_PASS_LIVE}"
    SONAR_PROJECT_KEY: "cim_agent-manager_7287d395-0fb2-41bb-ae26-ae6ffd06f7e4"
    SONAR_PROJECT_NAME: ${CI_PROJECT_NAME}
  only:
    - /^.+_f-.+$/
    - /^.+_b-.+$/
    - merge_requests
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    #- sonar-scanner -X -Dsonar.testExecutionReportPaths=coverage/test-report.xml -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info -Dsonar.exclusions=**/node_modules/** -Dsonar.test.inclusions=**/*.spec.ts -Dsonar.projectKey=$SONAR_PROJECT_KEY -Dsonar.sources=. -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.login=$SONAR_TOKEN -Dsonar.qualitygate.wait=true -Dsonar.projectName=${SONAR_PROJECT_NAME}
    #- sonar-scanner -X -Dsonar.sources=src/ -Dsonar.exclusions=tests/*.spec.js,src/services/cim.service.js -Dsonar.coverage.exclusions=tests/*.spec.js,tests/*.mock.js,node_modules/*,coverage/lcov-report/*,src/services/cim.service.js -Dsonar.tests=tests/ -Dsonar.language=js -Dsonar.sourceEncoding=UTF-8 -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info -Dsonar.testExecutionReportPaths=coverage/test-report.xml -Dsonar.projectKey=${SONAR_PROJECT_KEY} -Dsonar.qualitygate.wait=true -Dsonar.projectName=${CI_PROJECT_NAME}
    - sonar-scanner -X  -Dsonar.projectKey=${SONAR_PROJECT_KEY} -Dsonar.projectName=${CI_PROJECT_NAME} -Dsonar.sources=src -Dsonar.exclusions=**/node_modules/**,**/*.spec.ts -Dsonar.tests=src -Dsonar.test.inclusions=**/*.spec.ts -Dsonar.typescript.lcov.reportPaths=coverage/lcov.info \ -Dsonar.qualitygate.wait=true

  allow_failure: true



#+==================Runs onevery commit and tags manual========================+
gitlab_build_branch:
 image: docker:latest
 stage: build-gitlab
 when: manual
 services:
   - docker:dind
 before_script:
   - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
 dependencies:
   - node_artifacts
   - time_build
 script:
   - cp -r $(ls -A | grep -v -E "docker|coverage|.sonar") ./docker/
   - cd docker
   - |-
       if [ $CI_COMMIT_BRANCH != '' ]; then
         docker build --pull -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" .;
         docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" "${CI_REGISTRY_IMAGE}/build:${CI_COMMIT_BRANCH}-${CI_COMMIT_SHA}";
         docker push "${CI_REGISTRY_IMAGE}/build:${CI_COMMIT_BRANCH}-${CI_COMMIT_SHA}";
       elif [ $CI_COMMIT_TAG != '' ]; then
         docker build --pull -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" .;
         docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG";
       fi
 only:
   - /^.+_f-.+$/
   - /^.+_b-.+$/
   - tags
 allow_failure: false

#+==================Runs on merge requests only========================+
gitlab_build_merge:
  image: docker:latest
  stage: build-gitlab
  services:
    - docker:dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    - apk add --update curl jq
  dependencies:
    - node_artifacts
    - time_build

  variables:
    BRANCH: MERGE_BRANCH
    TIME_VAR: BUILD_TIME
    TOKEN: ${CI_PIPELINE_IID_TOKEN}
    GITLAB_URL: "https://gitlab.expertflow.com"

  script:
    - export TIME_TOKEN="$(cat .ci_status/ci_time)"
    - echo $TIME_TOKEN
    - 'curl -s -f --request PUT --header "PRIVATE-TOKEN: ${TOKEN}" "${GITLAB_URL}/api/v4/projects/${CI_PROJECT_ID}/variables/${TIME_VAR}" --form "value=${TIME_TOKEN}" '
    - 'curl -s -f --request PUT --header "PRIVATE-TOKEN: ${TOKEN}" "${GITLAB_URL}/api/v4/projects/${CI_PROJECT_ID}/variables/${BRANCH}" --form "value=${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}" '
    - cp -r $(ls -A | grep -v -E "docker|coverage|.sonar") ./docker/
    - cd docker
    - docker build --pull -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" .
    - docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" "${CI_REGISTRY_IMAGE}/build:${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}-${TIME_TOKEN}"
    - docker push "${CI_REGISTRY_IMAGE}/build:${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}-${TIME_TOKEN}"
  only:
    - merge_requests
  allow_failure: false
  artifacts:
    paths:
      - .ci_status/

##==================Trivy scan branch========================##
trivy_scanning_branch:
  extends: .trivy_scan_template
  when: on_success
  needs:
    - job: gitlab_build_branch
  allow_failure: false
  stage: scan
  variables:
    FULL_IMAGE_NAME: ${CI_REGISTRY_IMAGE}/build:${CI_COMMIT_BRANCH}-${CI_COMMIT_SHA}
  only:
    - /^.+_f-.+$/
    - /^.+_b-.+$/

##==================Trivy scan merge========================##
trivy_scanning_merge:
  stage: scan
  extends: .trivy_scan_merge
  needs:
    - job: gitlab_build_merge
    - job: time_build
      artifacts: true
  only:
    - merge_requests

#+==================Runs on if docker build in branch========================+
grype_scan_branch:
  extends: .grype_template
  stage: scan
  needs:
    - job: gitlab_build_branch
  when: on_success
  allow_failure: false
  variables:
    SCAN_IMAGE: $CI_REGISTRY_IMAGE/build:$CI_COMMIT_BRANCH-$CI_COMMIT_SHA
  only:
    - /^.+_f-.+$/
    - /^.+_b-.+$/

#+==================Runs on merge requests only========================+
grype_scan_merge:
  stage: scan
  extends: .grype_template_merge
  needs:
    - job: gitlab_build_merge
    - job: time_build
      artifacts: true
  only:
    - merge_requests
