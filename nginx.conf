server {
    listen 80;
    server_name _;

    # Root for static files
    root /usr/share/nginx/html;

    # Redirect root to tenant-portal path
    location = / {
        return 302 /tenant-portal/;
    }

    # Serve the Angular single-page app at /tenant-portal/
    location /tenant-portal/ {
        # Use `root` so paths resolve as /usr/share/nginx/html/tenant-portal/...
        root /usr/share/nginx/html;
        index index.html;
        # Try requested URI, then directory, then fallback to the SPA index
        try_files $uri $uri/ /tenant-portal/index.html;
    }

    # Serve static assets directly (both with and without tenant prefix)
    # Some code may request `/assets/...` (absolute) while app is served under `/tenant-portal/`.
    # Map both paths to the same assets folder.
    location /assets/ {
        root /usr/share/nginx/html/tenant-portal;
        expires 1d;
        add_header Cache-Control public;
    }

    location /tenant-portal/assets/ {
        root /usr/share/nginx/html;
        expires 1d;
        add_header Cache-Control public;
    }

    # Health check
    location /healthz {
        return 200;
    }
}
