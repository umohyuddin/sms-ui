<div class="modal fade show d-block" tabindex="-1" role="dialog">
  <div class="modal-dialog modal-l modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content rounded-3 shadow">
      <!-- Header -->
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title container text-center">
          {{ result.id ? 'Edit Result' : 'Add New Result' }}
        </h5>
        <button type="button" class="btn-close btn-close-white" (click)="close()"></button>
      </div>

      <!-- Body -->
      <div class="modal-body">
        <form>
            <div class="container text-left">
                <div class="row">
                    <div class="col mb-3">
                        <label class="form-label">Subject</label>
                        <input 
                            type="text" 
                            class="form-control"
                            [(ngModel)]="result.subjectId"
                            name="subjectId"
                            placeholder="Enter subject">
                    </div>
                    <div class="col mb-3">
                        <label class="form-label">Student</label>
                        <input 
                            type="text" 
                            class="form-control"
                            [(ngModel)]="result.studentId"
                            name="studentId"
                            placeholder="Enter student">
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col mb-3">
                    <label class="form-label">Marks</label>
                    <input 
                        type="text" 
                        class="form-control"
                        [(ngModel)]="result.marks"
                        name="marks"
                        placeholder="Enter marks">
                </div>
                <div class="col mb-3">
                    <label class="form-label">Grade</label>
                    <input 
                        type="text" 
                        class="form-control"
                        [(ngModel)]="result.grade"
                        name="grade"
                        placeholder="Enter grade">
                </div>
            </div>
            <div class="row">
                <div class="col mb-3">
                    <label class="form-label">Status</label>
                    <input 
                        type="text" 
                        class="form-control"
                        [(ngModel)]="result.status"
                        name="status"
                        placeholder="Enter status">
                </div>
                <div class="col mb-3">
                </div>
            </div>
        </form>
      </div>

      <!-- Footer -->
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="close()">Cancel</button>
        <button type="button" class="btn btn-success" (click)="save()">
          {{ isSaved ? 'Update' : 'Save' }}
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Optional backdrop -->
<div class="modal-backdrop fade show"></div>
