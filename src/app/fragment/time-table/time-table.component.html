<div class="card shadow-sm">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h5 class="mb-0">Time Table</h5>
    <input 
      type="text" 
      class="form-control w-25" 
      placeholder="Search..."
      [(ngModel)]="searchTerm"
      (input)="applyFilter()" />
      <button type="button" class="btn btn-sm btn-success me-2" (click)="onAdd()">ADD</button>
  </div>

  <div class="card-body p-0">
    <table class="table table-striped table-hover mb-0">
      <thead class="table-light">
        <tr>
          <th scope="col">#</th>
          <th scope="col" >ID</th>
          <th scope="col" (click)="sortData('classId')" style="cursor: pointer">
            Class ID <span *ngIf="sortColumn === 'classId'">{{ sortDirection === 'asc' ? '▲' : '▼' }}</span>
          </th>
          <th scope="col" >Slot</th>
          <th scope="col" >Monday</th>
          <th scope="col" >Tuesday</th>
          <th scope="col" >Wednesday</th>
          <th scope="col" >Thursday</th>
          <th scope="col" >Friday</th>
          <th scope="col" >Saturday</th>
          <th scope="col" >Sunday</th>
          <th scope="col" >Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let slr of filteredTimeTable; let i = index">
          <th scope="row">{{i+1}}</th>
          <td>{{ slr.id }}</td>
          <td>{{ slr.classId }}</td>
          <td>{{ slr.duration }}</td>
          <td>{{ slr.mon }}</td>
          <td>{{ slr.tue }}</td>
          <td>{{ slr.wed }}</td>
          <td>{{ slr.thu }}</td>
          <td>{{ slr.fri }}</td>
          <td>{{ slr.sat }}</td>
          <td>{{ slr.sun }}</td>
          <td>
            <button class="btn btn-sm btn-warning me-2" (click)="onEdit(slr, i)">Edit</button>
            <button class="btn btn-sm btn-danger" (click)="onDelete(slr, i)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
