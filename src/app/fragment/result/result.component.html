<div class="card shadow-sm">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h5 class="mb-0">Results</h5>
    <input 
      type="text" 
      class="form-control w-25" 
      placeholder="Search..."
      [(ngModel)]="searchTerm"
      (input)="applyFilter()" />
      <button type="button" class="btn btn-sm btn-success me-2" (click)="onAdd()">ADD</button>
  </div>

  <div class="card-body p-0">
    <table class="table table-striped table-hover mb-0">
      <thead class="table-light">
        <tr>
          <th scope="col">#</th>
          <th scope="col">ID</th>
          <th scope="col">Subject Id</th>
          <th scope="col" (click)="sortData('studentId')" style="cursor: pointer">
            Student Id <span *ngIf="sortColumn === 'studentId'">{{ sortDirection === 'asc' ? '▲' : '▼' }}</span>
          </th>
          <th scope="col">Marks</th>
          <th scope="col">Grade</th>
          <th scope="col">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let r of filteredlist; let i = index">
          <th scope="row">{{i+1}}</th>
          <td>{{ r.id }}</td>
          <td>{{ r.subjectId }}</td>
          <td>{{ r.studentId }}</td>
          <td>{{ r.marks }}</td>
          <td>{{ r.grade }}</td>
          <td>
            <button class="btn btn-sm btn-warning me-2" (click)="onEdit(r, i)">Edit</button>
            <button class="btn btn-sm btn-danger" (click)="onDelete(r, i)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
   
</div>
