<div class="card shadow-sm">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h5 class="mb-0">Expenses</h5>
    <input 
      type="text" 
      class="form-control w-25" 
      placeholder="Search..."
      [(ngModel)]="searchTerm"
      (input)="applyFilter()" />
      <button type="button" class="btn btn-sm btn-success me-2" (click)="onAdd()">ADD</button>
  </div>

  <div class="card-body p-0">
    <table class="table table-striped table-hover mb-0">
      <thead class="table-light">
        <tr>
          <th scope="col">#</th>
          <th scope="col">ID</th>
          <th scope="col" (click)="sortData('campusId')" style="cursor: pointer">
            Campus Id <span *ngIf="sortColumn === 'campusId'">{{ sortDirection === 'asc' ? '▲' : '▼' }}</span>
          </th>
          <th scope="col">Amount</th>
          <th scope="col">Details</th>
          <th scope="col">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let exp of filteredlist; let i = index">
          <th scope="row">{{i+1}}</th>
          <td>{{ exp.id }}</td>
          <td>{{ exp.campusId }}</td>
          <td>{{ exp.amount }}</td>
          <td>{{ exp.details }}</td>
          <td>
            <button class="btn btn-sm btn-warning me-2" (click)="onEdit(exp, i)">Edit</button>
            <button class="btn btn-sm btn-danger" (click)="onDelete(exp, i)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
   
</div>
