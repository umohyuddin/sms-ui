<div class="modal fade" [ngClass]="{ 'show d-block': isVisible }" tabindex="-1" role="dialog"
  [style.background]="isVisible ? 'rgba(0,0,0,0.5)' : 'none'">
  <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
    <div class="modal-content shadow-lg border-0">
      <div class="modal-header bg-dark text-white p-4">
        <h5 class="modal-title font-weight-bold">
          <i class="flaticon-add-circular-button mr-2"></i>
          {{ isEditMode ? 'Update Fee Component' : 'Add New Fee Component' }}
        </h5>
        <button type="button" class="close text-white" (click)="close()" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>

      <div class="modal-body p-0">
        <form class="kt-form kt-form--label-right" [formGroup]="createForm" (ngSubmit)="onSubmit()">
          <div class="kt-portlet__body p-4">
            <h6 class="text-primary mb-4">Fee Component Details</h6>

            <div class="form-group row mb-4">
              <div class="col-lg-6">
                <label class="required font-weight-bold">Fee Catalog</label>
                <select class="form-control" formControlName="feeCatalogId"
                  [class.is-invalid]="feeCatalogId?.invalid && (feeCatalogId?.touched || feeCatalogId?.dirty)">
                  <option value="">Select Fee Catalog</option>
                  <option *ngFor="let catalog of feeCatalogDD" [value]="catalog.id">{{ catalog.name }}</option>
                </select>
                <span class="invalid-feedback"
                  *ngIf="feeCatalogId?.invalid && (feeCatalogId?.touched || feeCatalogId?.dirty)">
                  {{ getErrorMessage('feeCatalogId') }}
                </span>
              </div>

              <div class="col-lg-6">
                <label class="required font-weight-bold">Component Name</label>
                <input type="text" class="form-control" placeholder="Component Name" formControlName="componentName"
                  [class.is-invalid]="componentName?.invalid && (componentName?.touched || componentName?.dirty)">
                <span class="invalid-feedback"
                  *ngIf="componentName?.invalid && (componentName?.touched || componentName?.dirty)">
                  {{ getErrorMessage('componentName') }}
                </span>
              </div>
            </div>

            <div class="form-group row mb-4">
              <div class="col-lg-6">
                <label class="font-weight-bold">Component Code</label>
                <input type="text" class="form-control" placeholder="Component Code" formControlName="componentCode"
                  [class.is-invalid]="componentCode?.invalid && (componentCode?.touched || componentCode?.dirty)">
                <span class="invalid-feedback"
                  *ngIf="componentCode?.invalid && (componentCode?.touched || componentCode?.dirty)">
                  {{ getErrorMessage('componentCode') }}
                </span>
              </div>

              <div class="col-lg-3">
                <label class="font-weight-bold d-block">Status</label>
                <label class="kt-checkbox kt-checkbox--brand mt-2">
                  <input type="checkbox" formControlName="active"> Is Active
                  <span></span>
                </label>
              </div>

              <div class="col-lg-3">
                <label class="font-weight-bold d-block">Discount</label>
                <label class="kt-checkbox kt-checkbox--success mt-2">
                  <input type="checkbox" formControlName="discountable"> Applicable
                  <span></span>
                </label>
              </div>
            </div>
          </div>

          <div class="modal-footer bg-light border-0">
            <button type="button" class="btn btn-secondary font-weight-bold" (click)="close()">Cancel</button>
            <button type="submit" class="btn btn-dark font-weight-bold px-4">
              {{ isEditMode ? 'Save Changes' : 'Add Component' }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
