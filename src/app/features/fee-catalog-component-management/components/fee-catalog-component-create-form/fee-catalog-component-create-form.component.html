<div class="kt-portlet">
  <div class="kt-portlet__head">
    <div class="kt-portlet__head-label">
      <h3 class="kt-portlet__head-title">
        {{ isEditMode ? 'Update Fee Component' : 'Add New Fee Component' }}
      </h3>
    </div>
  </div>

  <div class="kt-portlet__body p-0">
    <form class="kt-form kt-form--label-right" [formGroup]="createForm" (ngSubmit)="onSubmit()">
      <div class="kt-portlet__body">
        <h6 class="text-primary mb-4">Fee Component Details</h6>

        <div class="form-group row form-group-marginless kt-margin-t-20">
          <label class="col-lg-1 col-form-label required font-weight-bold">Fee Catalog:</label>
          <div class="col-lg-3">
            <select class="form-control" formControlName="feeCatalogId"
              [class.is-invalid]="feeCatalogId?.invalid && (feeCatalogId?.touched || feeCatalogId?.dirty)">
              <option value="">Select Fee Catalog</option>
              <option *ngFor="let catalog of feeCatalogDD" [value]="catalog.id">{{ catalog.name }}</option>
            </select>
            <span class="invalid-feedback"
              *ngIf="feeCatalogId?.invalid && (feeCatalogId?.touched || feeCatalogId?.dirty)">
              {{ getErrorMessage('feeCatalogId') }}
            </span>
          </div>

          <label class="col-lg-1 col-form-label required font-weight-bold">Component Name:</label>
          <div class="col-lg-3">
            <input type="text" class="form-control" placeholder="Component Name" formControlName="componentName"
              [class.is-invalid]="componentName?.invalid && (componentName?.touched || componentName?.dirty)">
            <span class="invalid-feedback"
              *ngIf="componentName?.invalid && (componentName?.touched || componentName?.dirty)">
              {{ getErrorMessage('componentName') }}
            </span>
          </div>

          <label class="col-lg-1 col-form-label font-weight-bold">Component Code:</label>
          <div class="col-lg-3">
            <input type="text" class="form-control" placeholder="Component Code" formControlName="componentCode"
              [class.is-invalid]="componentCode?.invalid && (componentCode?.touched || componentCode?.dirty)">
            <span class="invalid-feedback"
              *ngIf="componentCode?.invalid && (componentCode?.touched || componentCode?.dirty)">
              {{ getErrorMessage('componentCode') }}
            </span>
          </div>
        </div>

        <div class="form-group row form-group-marginless kt-margin-t-20">
          <label class="col-lg-1 col-form-label font-weight-bold">Status:</label>
          <div class="col-lg-3">
            <label class="kt-checkbox kt-margin-t-10">
              <input type="checkbox" formControlName="active"> Is Active
              <span></span>
            </label>
          </div>

          <label class="col-lg-1 col-form-label font-weight-bold">Discount:</label>
          <div class="col-lg-3">
            <label class="kt-checkbox kt-margin-t-10">
              <input type="checkbox" formControlName="discountable"> Applicable
              <span></span>
            </label>
          </div>
        </div>
      </div>

      <div class="kt-portlet__foot">
        <div class="kt-form__actions">
          <div class="row">
            <div class="col-lg-5"></div>
            <div class="col-lg-7">
              <button type="submit" class="btn btn-dark mr-2">
                {{ isEditMode ? 'Save Changes' : 'Add Component' }}
              </button>
              <button type="button" class="btn btn-danger" (click)="goToListing()">Cancel</button>
            </div>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
