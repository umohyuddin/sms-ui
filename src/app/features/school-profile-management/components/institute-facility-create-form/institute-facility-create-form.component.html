<app-toaster></app-toaster>

<div class="kt-portlet">
  <div class="kt-portlet__head">
    <div class="kt-portlet__head-label">
      <h3 class="kt-portlet__head-title">Add Facilities</h3>
    </div>
  </div>
  <div class="kt-portlet__body">
    <div *ngIf="isLoadingFacilityTypes" class="text-center py-5">
      <i class="fa fa-spinner fa-spin fa-3x"></i>
      <p class="mt-3">Loading facility types...</p>
    </div>

    <div *ngIf="!isLoadingFacilityTypes && facilitySelections.length === 0" class="alert alert-info">
      No facility types available. Please add facility types first.
    </div>

    <form *ngIf="!isLoadingFacilityTypes && facilitySelections.length > 0" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label class="font-weight-bold mb-3">Select Facility Types <span class="text-danger">*</span></label>
        <div class="facility-list">
          <div class="row align-items-center mb-3 facility-row" *ngFor="let selection of facilitySelections; let i = index">
            <div class="col-md-3">
              <label class="btn btn-outline-brand btn-elevate btn-pill w-100 text-left py-2"
                     [class.active]="selection.selected"
                     (click)="toggleSelection(selection)"
                     style="cursor: pointer; border: 2px solid; transition: all 0.3s;">
                <input type="checkbox" 
                       [checked]="selection.selected"
                       (click)="$event.stopPropagation()"
                       style="display: none;">
                <i class="fa" 
                   [class.fa-check-circle]="selection.selected" 
                   [class.fa-circle-o]="!selection.selected"></i>
                <span class="ml-2">{{ selection.facilityTypeName }}</span>
              </label>
            </div>
            <div class="col-md-3">
              <input 
                type="number" 
                class="form-control" 
                [(ngModel)]="selection.capacity"
                [name]="'capacity_' + i"
                placeholder="Capacity"
                min="1"
                [disabled]="!selection.selected"
              />
            </div>
            <div class="col-md-6">
              <input 
                type="text" 
                class="form-control" 
                [(ngModel)]="selection.description"
                [name]="'description_' + i"
                placeholder="Description (optional)"
                maxlength="500"
                [disabled]="!selection.selected"
              />
            </div>
          </div>
        </div>
      </div>

      <div class="kt-portlet__foot">
        <div class="kt-form__actions">
          <div class="row">
            <div class="col-lg-12 text-right">
              <button 
                type="submit" 
                class="btn btn-dark mr-2"
                [disabled]="isLoading || !hasSelections"
              >
                <span *ngIf="!isLoading">
                  <i class="fa fa-save"></i> Create Selected Facilities
                </span>
                <span *ngIf="isLoading">
                  <i class="fa fa-spinner fa-spin"></i> Creating...
                </span>
              </button>
              <button 
                type="button" 
                class="btn btn-secondary" 
                (click)="resetForm()"
                [disabled]="isLoading"
              >
                <i class="fa fa-undo"></i> Reset
              </button>
            </div>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
