<app-toaster #toaster></app-toaster>
<app-loader *ngIf="isLoading || isSaving" type="pulse" size="lg" color="primary" [message]="loadingMessage"
	[overlay]="true" [fullScreen]="true"
	style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999;">
</app-loader>

<div class="kt-portlet">
	<div class="kt-portlet__head">
		<div class="kt-portlet__head-label">
			<h3 class="kt-portlet__head-title">
				Bulk Manage Permissions
			</h3>
		</div>
		<div class="kt-portlet__head-toolbar">
			<div class="kt-portlet__head-actions">
				<button type="button" class="btn btn-dark btn-elevate btn-icon-sm" (click)="onSave()">
					<i class="la la-save"></i>
					Save All Changes
				</button>
				<button type="button" class="btn btn-secondary btn-elevate btn-icon-sm ml-2"
					(click)="goToPermissionsListing()">
					<i class="la la-close"></i>
					Cancel
				</button>
			</div>
		</div>
	</div>

	<div class="kt-portlet__body kt-portlet__body--fit">
		<div class="kt-scroll" style="height: auto; max-height: 70vh; overflow-y: auto;">
			<div class="permission-grid-container p-4">
				<div *ngFor="let group of groupedData" class="module-group mb-4">
					<div class="module-header d-flex align-items-center p-3 text-white bg-dark rounded cursor-pointer"
						(click)="toggleModuleExpansion(group)">
						<i class="la" [ngClass]="group.isExpanded ? 'la-minus-circle' : 'la-plus-circle'"></i>
						<span class="ml-2 font-weight-bold">{{ group.module.name }}</span>
						<span class="badge badge-light badge-inline ml-3">{{ group.module.code }}</span>
					</div>

					<div *ngIf="group.isExpanded" class="resources-table-container mt-2">
						<table class="table table-bordered table-hover">
							<thead class="thead-light">
								<tr>
									<th style="width: 250px;">Resource</th>
									<th *ngFor="let action of actions" class="text-center">
										{{ action.name }}
									</th>
								</tr>
							</thead>
							<tbody>
								<tr *ngFor="let res of group.resources">
									<td class="align-middle">
										<div class="font-weight-bold">{{ res.resourceName }}</div>
										<small class="text-muted">{{ res.description }}</small>
									</td>
									<td *ngFor="let action of actions" class="text-center align-middle">
										<div class="d-flex flex-column align-items-center">
											<label class="kt-checkbox kt-checkbox--brand kt-checkbox--single m-0">
												<input type="checkbox"
													[checked]="isPermissionSelected(res.id, action.id)"
													(change)="togglePermission(res.id, action.id)">
												<span></span>
											</label>

											<!-- Update Support: Active Toggle for existing permissions -->
											<div *ngIf="isPermissionSelected(res.id, action.id) && getExistingPermissionId(res.id, action.id) as permId"
												class="mt-2 metadata-actions">
												<span class="status-toggle cursor-pointer"
													[ngClass]="permissionMetadataMap.get(permId)?.active ? 'text-success' : 'text-danger'"
													(click)="toggleActiveStatus(permId)"
													[title]="permissionMetadataMap.get(permId)?.active ? 'Active' : 'Inactive'">
													<i class="la"
														[ngClass]="permissionMetadataMap.get(permId)?.active ? 'la-check-circle' : 'la-times-circle'"></i>
												</span>
												<span class="ml-1 edit-metadata cursor-pointer text-primary"
													(click)="openMetadataEditor(permId)" title="Edit Name/Description">
													<i class="la la-edit"></i>
												</span>
											</div>
										</div>
									</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- Metadata Editor Modal -->
	<div class="modal fade" [ngClass]="{'show': isMetadataModalOpen}"
		[style.display]="isMetadataModalOpen ? 'block' : 'none'" tabindex="-1" role="dialog" aria-hidden="true"
		style="background: rgba(0,0,0,0.5);">
		<div class="modal-dialog modal-dialog-centered" role="document">
			<div class="modal-content border-0 shadow-lg">
				<div class="modal-header bg-dark text-white">
					<h5 class="modal-title">Edit Permission Metadata</h5>
					<button type="button" class="close text-white" (click)="closeMetadataModal()">
						<span aria-hidden="true">&times;</span>
					</button>
				</div>
				<div class="modal-body pb-0" *ngIf="editingMetadata">
					<div class="form-group">
						<label class="font-weight-bold">Permission Name</label>
						<input type="text" class="form-control" [(ngModel)]="editingMetadata.name" name="permName"
							placeholder="Enter name">
					</div>
					<div class="form-group mt-3">
						<label class="font-weight-bold">Description</label>
						<textarea class="form-control" rows="3" [(ngModel)]="editingMetadata.description"
							name="permDesc" placeholder="Enter description"></textarea>
					</div>
					<div class="form-group mt-3 mb-4">
						<div class="d-flex align-items-center">
							<label class="kt-checkbox kt-checkbox--brand m-0">
								<input type="checkbox" [(ngModel)]="editingMetadata.active" name="permActive">
								<span></span>
							</label>
							<span class="ml-2 font-weight-bold">Active Status</span>
						</div>
					</div>
				</div>
				<div class="modal-footer border-0">
					<button type="button" class="btn btn-secondary" (click)="closeMetadataModal()">Cancel</button>
					<button type="button" class="btn btn-brand" (click)="saveMetadataChanges()">Apply Changes</button>
				</div>
			</div>
		</div>
	</div>

	<div class="kt-portlet__foot">
		<div class="kt-form__actions">
			<div class="row">
				<div class="col-lg-12 text-right">
					<button type="button" class="btn btn-dark mr-2" (click)="onSave()" [disabled]="isSaving">
						Save All Changes
					</button>
					<button type="button" class="btn btn-secondary" (click)="goToPermissionsListing()">Cancel</button>
				</div>
			</div>
		</div>
	</div>
</div>
