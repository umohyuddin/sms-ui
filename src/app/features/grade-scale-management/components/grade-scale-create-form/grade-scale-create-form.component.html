<app-toaster #toaster></app-toaster>
<app-loader *ngIf="loading" type="pulse" size="lg" color="primary" message="Loading..." [overlay]="true"
    [fullScreen]="true" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999;">
</app-loader>

<div class="kt-portlet">
    <div class="kt-portlet__head">
        <div class="kt-portlet__head-label">
            <h3 class="kt-portlet__head-title">
                {{ isEdit ? 'Update Grade Scale' : 'Add New Grade Scale' }}
            </h3>
        </div>
    </div>

    <form class="kt-form kt-form--label-right" [formGroup]="gradeScaleForm" (ngSubmit)="onSubmit()">
        <div class="kt-portlet__body">
            <h4 class="kt-margin-b-20">Grade Scale Information</h4>
            <div class="form-group row form-group-marginless">
                <label class="col-lg-1 col-form-label required">Grade:</label>
                <div class="col-lg-3">
                    <input type="text" class="form-control" placeholder="Enter grade (e.g. A, B+)"
                        formControlName="grade"
                        [class.is-invalid]="gradeScaleForm.get('grade')?.invalid && (gradeScaleForm.get('grade')?.touched || gradeScaleForm.get('grade')?.dirty)">
                    <span class="invalid-feedback">Grade is required</span>
                </div>

                <label class="col-lg-1 col-form-label required">Min %:</label>
                <div class="col-lg-3">
                    <input type="number" class="form-control" placeholder="Min percentage"
                        formControlName="minPercentage"
                        [class.is-invalid]="gradeScaleForm.get('minPercentage')?.invalid && (gradeScaleForm.get('minPercentage')?.touched || gradeScaleForm.get('minPercentage')?.dirty)">
                    <span class="invalid-feedback">Min % (0-100) is required</span>
                </div>

                <label class="col-lg-1 col-form-label required">Max %:</label>
                <div class="col-lg-3">
                    <input type="number" class="form-control" placeholder="Max percentage"
                        formControlName="maxPercentage"
                        [class.is-invalid]="gradeScaleForm.get('maxPercentage')?.invalid && (gradeScaleForm.get('maxPercentage')?.touched || gradeScaleForm.get('maxPercentage')?.dirty)">
                    <span class="invalid-feedback">Max % (0-100) is required</span>
                </div>
            </div>

            <div class="form-group row form-group-marginless kt-margin-t-20">
                <label class="col-lg-1 col-form-label">Remarks:</label>
                <div class="col-lg-11">
                    <textarea class="form-control" rows="3" placeholder="Enter remarks"
                        formControlName="remarks"></textarea>
                </div>
            </div>

            <div class="form-group row form-group-marginless kt-margin-t-20">
                <label class="col-lg-1 col-form-label">Status:</label>
                <div class="col-lg-3">
                    <label class="kt-checkbox kt-margin-t-10">
                        <input type="checkbox" formControlName="active"> Is Active
                        <span></span>
                    </label>
                </div>
            </div>
        </div>

        <div class="kt-portlet__foot">
            <div class="kt-form__actions">
                <div class="row">
                    <div class="col-lg-12 text-right">
                        <button type="submit" class="btn btn-dark mr-2" [disabled]="gradeScaleForm.invalid || loading">
                            {{ loading ? 'Saving...' : 'Submit' }}
                        </button>
                        <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
