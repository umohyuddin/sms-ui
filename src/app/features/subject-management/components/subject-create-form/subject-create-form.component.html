<div class="kt-portlet">
  <div class="kt-portlet__head">
    <div class="kt-portlet__head-label">
      <h3 class="kt-portlet__head-title">
        {{ isEdit ? 'Update Subject Details' : 'Add New Subject' }}
      </h3>
    </div>
  </div>

  <form class="kt-form kt-form--label-right" [formGroup]="subjectForm" (ngSubmit)="onSubmit()">
    <div class="kt-portlet__body">
      <h4 class="kt-margin-b-20">Subject Information</h4>
      <div class="form-group row form-group-marginless">
        <label class="col-lg-1 col-form-label required">Subject Name:</label>
        <div class="col-lg-3">
          <input type="text" class="form-control" placeholder="Enter subject name" formControlName="name"
            [class.is-invalid]="subjectForm.get('name')?.invalid && (subjectForm.get('name')?.touched || subjectForm.get('name')?.dirty)"
            [class.is-valid]="subjectForm.get('name')?.valid && (subjectForm.get('name')?.touched || subjectForm.get('name')?.dirty)">
          <span class="form-text text-muted">Please enter subject name</span>
          <span class="invalid-feedback" *ngIf="subjectForm.get('name')?.invalid && (subjectForm.get('name')?.touched || subjectForm.get('name')?.dirty)">
            Subject name is required
          </span>
        </div>

        <label class="col-lg-1 col-form-label required">Code:</label>
        <div class="col-lg-3">
          <input type="text" class="form-control" placeholder="Enter subject code" formControlName="code"
            [class.is-invalid]="subjectForm.get('code')?.invalid && (subjectForm.get('code')?.touched || subjectForm.get('code')?.dirty)"
            [class.is-valid]="subjectForm.get('code')?.valid && (subjectForm.get('code')?.touched || subjectForm.get('code')?.dirty)">
          <span class="form-text text-muted">Please enter subject code</span>
          <span class="invalid-feedback" *ngIf="subjectForm.get('code')?.invalid && (subjectForm.get('code')?.touched || subjectForm.get('code')?.dirty)">
            Subject code is required
          </span>
        </div>

        <label class="col-lg-1 col-form-label required">Subject Group:</label>
        <div class="col-lg-3">
          <select class="form-control" formControlName="subjectGroupId"
            [class.is-invalid]="subjectForm.get('subjectGroupId')?.invalid && (subjectForm.get('subjectGroupId')?.touched || subjectForm.get('subjectGroupId')?.dirty)"
            [class.is-valid]="subjectForm.get('subjectGroupId')?.valid && (subjectForm.get('subjectGroupId')?.touched || subjectForm.get('subjectGroupId')?.dirty)">
            <option value="">Select Group</option>
            <option *ngFor="let group of groups" [value]="group.id">{{ group.name }}</option>
          </select>
          <span class="form-text text-muted">Please select subject group</span>
          <span class="invalid-feedback" *ngIf="subjectForm.get('subjectGroupId')?.invalid && (subjectForm.get('subjectGroupId')?.touched || subjectForm.get('subjectGroupId')?.dirty)">
            Subject group is required
          </span>
        </div>
      </div>

      <div class="form-group row form-group-marginless kt-margin-t-20">
        <label class="col-lg-1 col-form-label">Description:</label>
        <div class="col-lg-11">
          <textarea class="form-control" formControlName="description" rows="3" placeholder="Enter description"></textarea>
          <span class="form-text text-muted">Please enter description (optional)</span>
        </div>
      </div>

      <div class="form-group row form-group-marginless kt-margin-t-20">
        <label class="col-lg-1 col-form-label">Options:</label>
        <div class="col-lg-3">
          <label class="kt-checkbox kt-margin-t-10">
            <input type="checkbox" formControlName="isElective"> Is Elective
            <span></span>
          </label>
        </div>
        <div class="col-lg-3">
          <label class="kt-checkbox kt-margin-t-10">
            <input type="checkbox" formControlName="isActive"> Is Active
            <span></span>
          </label>
        </div>
      </div>
    </div>

    <div class="kt-portlet__foot">
      <div class="kt-form__actions">
        <div class="row">
          <div class="col-lg-12 text-right">
            <button type="submit" class="btn btn-brand" [disabled]="subjectForm.invalid || loading">
              {{ loading ? 'Saving...' : 'Submit' }}
            </button>
            <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
          </div>
        </div>
      </div>
    </div>
  </form>
</div>
