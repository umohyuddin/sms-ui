<div class="kt-subheader kt-grid__item" id="kt_subheader">
  <div class="kt-container kt-container--fluid">
    <div class="kt-subheader__main">
      <h3 class="kt-subheader__title">
        <a href="javascript:;" (click)="goBack()" class="kt-link kt-font-dark kt-font-bold">
          <i class="la la-angle-double-left"></i> Manage Subjects
        </a>
      </h3>
      <span class="kt-subheader__separator kt-subheader__separator--v"></span>
      <span class="kt-subheader__desc">Subject Details</span>
    </div>
    <div class="kt-subheader__toolbar">
      <div class="kt-subheader__wrapper">
        <button (click)="editSubject()" class="btn btn-outline-success">
          <i class="la la-edit"></i>
          Update Details
        </button>
      </div>
    </div>
  </div>
</div>
