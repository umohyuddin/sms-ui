<app-toaster #toaster></app-toaster>
<app-loader *ngIf="loading" type="pulse" size="lg" color="primary" message="Loading..." [overlay]="true"
    [fullScreen]="true" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999;">
</app-loader>

<div class="kt-portlet kt-portlet--mobile">
    <div class="kt-portlet__head kt-portlet__head--lg">
        <div class="kt-portlet__head-label">
            <span class="kt-portlet__head-icon">
                <i class="kt-font-dark flaticon-interface-5"></i>
            </span>
            <h3 class="kt-portlet__head-title">
                Action Management
            </h3>
        </div>
        <div class="kt-portlet__head-toolbar">
            <div class="kt-portlet__head-wrapper">
                <button (click)="onAddAction()" class="btn btn-dark btn-icon-sm">
                    <i class="la la-plus"></i> New Action
                </button>
            </div>
        </div>
    </div>
    <div class="kt-portlet__body">
        <div class="row">
            <div class="col-sm-12">
                
                <table class="table table-striped- table-bordered table-hover">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Code</th>
                            <th>Description</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let action of pagination.paginatedItems">
                            <td>{{ action.name }}</td>
                            <td><code>{{ action.code }}</code></td>
                            <td>{{ action.description }}</td>
                            <td>
                                <span class="kt-badge kt-badge--inline kt-badge--pill"
                                    [ngClass]="action.active ? 'kt-badge--success' : 'kt-badge--danger'">
                                    {{ action.active ? 'Active' : 'Inactive' }}
                                </span>
                            </td>
                            <td>
                                <a (click)="onEditAction(action)" class="btn btn-sm btn-clean btn-icon btn-icon-md"
                                    title="Edit">
                                    <i class="la la-edit"></i>
                                </a>
                                <a (click)="onDeleteAction(action.id)" class="btn btn-sm btn-clean btn-icon btn-icon-md"
                                    title="Delete">
                                    <i class="la la-trash"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <div *ngIf="actions.length === 0" class="alert alert-dark" role="alert">
                    No actions found.
                </div>
            </div>
        </div>
    </div>
</div>

<app-delete-popup [show]="isDeletePopupOpen" title="Delete Action"
    message="Are you sure you want to delete this action?" confirmText="Delete" (confirm)="onConfirmDelete()"
    (cancel)="onCancelDelete()">
</app-delete-popup>
