<div *ngFor="let step of steps; let i = index" class="kt-portlet mb-3">

  <!-- STEP HEADER -->
  <div class="kt-portlet__head">
    <div class="kt-portlet__head-label">
      <h3 class="kt-portlet__head-title">
        {{ step.title }}
        <span *ngIf="step.completed" class="text-success ml-2">✔ Completed</span>
      </h3>
    </div>
  </div>

  <div class="kt-portlet__body">

    <!-- ========================= -->
    <!-- EMPLOYEE DETAILS FORM -->
    <!-- ========================= -->
    <form *ngIf="step.title === 'Employee Details' && step.formGroup as fg" [formGroup]="fg" (ngSubmit)="step.action()">

      <h4>Personal Information → Employee Details</h4>

      <!-- Name Row -->
      <div class="form-group row kt-margin-t-20">
        <label class="col-lg-1 col-form-label">First Name:</label>
        <div class="col-lg-3">
          <input type="text" class="form-control" formControlName="firstName">
        </div>

        <label class="col-lg-1 col-form-label">Last Name:</label>
        <div class="col-lg-3">
          <input type="text" class="form-control" formControlName="lastName">
        </div>

        <label class="col-lg-1 col-form-label">Middle Name:</label>
        <div class="col-lg-3">
          <input type="text" class="form-control" formControlName="middleName">
        </div>
      </div>

      <!-- Contact Row -->
      <div class="form-group row kt-margin-t-20">
        <label class="col-lg-1 col-form-label">Primary Phone:</label>
        <div class="col-lg-3">
          <input type="text" class="form-control" formControlName="primaryPhone">
        </div>

        <label class="col-lg-1 col-form-label">Secondary Phone:</label>
        <div class="col-lg-3">
          <input type="text" class="form-control" formControlName="secondaryPhone">
        </div>

        <label class="col-lg-1 col-form-label">Work Phone:</label>
        <div class="col-lg-3">
          <input type="text" class="form-control" formControlName="workPhone">
        </div>
      </div>

      <!-- Meta Row -->
      <div class="form-group row kt-margin-t-20">
        <label class="col-lg-1 col-form-label">DOB:</label>
        <div class="col-lg-3">
          <input type="date" class="form-control" formControlName="dateOfBirth">
        </div>

        <label class="col-lg-1 col-form-label">Email:</label>
        <div class="col-lg-3">
          <input type="email" class="form-control" formControlName="email">
        </div>

        <label class="col-lg-1 col-form-label">Gender:</label>
        <div class="col-lg-3">
          <select class="form-control" formControlName="gender">
            <option value="">Select gender</option>
            <option *ngFor="let g of genderDD" [value]="g.key">
              {{ g.label }}
            </option>
          </select>
        </div>
      </div>

      <!-- Extra Info -->
      <div class="form-group row kt-margin-t-20">
        <label class="col-lg-1 col-form-label">Religion:</label>
        <div class="col-lg-3">
          <select class="form-control" formControlName="religion">
            <option value="">Select religion</option>
            <option *ngFor="let r of religionDD" [value]="r.key">
              {{ r.label }}
            </option>
          </select>
        </div>

        <label class="col-lg-1 col-form-label">Marital Status:</label>
        <div class="col-lg-3">
          <select class="form-control" formControlName="maritalStatus">
            <option value="">Select marital status</option>
            <option *ngFor="let m of maritalStatusDD" [value]="m.key">
              {{ m.label }}
            </option>
          </select>
        </div>

        <label class="col-lg-1 col-form-label">Blood Group:</label>
        <div class="col-lg-3">
          <select class="form-control" formControlName="bloodGroup">
            <option value="">Select blood group</option>
            <option *ngFor="let b of bloodGroupDD" [value]="b.key">
              {{ b.label }}
            </option>
          </select>
        </div>
      </div>

      <!-- Bio -->
      <div class="form-group row kt-margin-t-20">
        <label class="col-lg-1 col-form-label">Bio / Notes:</label>
        <div class="col-lg-11">
          <textarea rows="3" class="form-control" formControlName="bio"></textarea>
        </div>
      </div>

      <div class="form-group row kt-margin-t-20">
        <div class="col-lg-12">
          <button class="btn btn-dark" type="submit">
            Save Employee Profile
          </button>
        </div>
      </div>
    </form>

    <!-- ========================= -->
    <!-- ASSIGN DEPARTMENT FORM -->
    <!-- ========================= -->
    <form *ngIf="step.title === 'Assign Department' && step.formGroup as fg" [formGroup]="fg"
      (ngSubmit)="step.action()">

      <div class="form-group row">
        <label class="col-lg-1 col-form-label">Department:</label>

        <div class="col-lg-3">
          <select class="form-control" formControlName="departmentId">
            <option value="">Select department</option>
            <option *ngFor="let d of departmentDD" [value]="d.key">
              {{ d.label }}
            </option>
          </select>

          <div class="invalid-feedback d-block" *ngIf="step.formGroup.get('departmentId')?.touched &&
                      step.formGroup.get('departmentId')?.invalid">
            Department is required
          </div>
        </div>

        <div class="col-lg-3">
          <button class="btn btn-dark" type="submit">
            Save Department
          </button>
        </div>
      </div>
    </form>

    <!-- ========================= -->
    <!-- ASSIGN DESIGNATION -->
    <!-- ========================= -->
    <form *ngIf="step.title === 'Assign Designation' && step.formGroup as fg" [formGroup]="fg"
      (ngSubmit)="step.action()">
      <div class="form-group row">
        <label class="col-lg-1 col-form-label">Designation:</label>

        <div class="col-lg-3">
          <select class="form-control" formControlName="designationId">
            <option value="">Select designation</option>
            <option *ngFor="let d of designationDD" [value]="d.key">
              {{ d.label }}
            </option>
          </select>

          <div class="invalid-feedback d-block"
            *ngIf="fg.get('designationId')?.touched && fg.get('designationId')?.invalid">
            Designation is required
          </div>
        </div>

        <div class="col-lg-3">
          <button class="btn btn-dark" type="submit">
            Save Designation
          </button>
        </div>
      </div>
    </form>


  </div>
</div>
