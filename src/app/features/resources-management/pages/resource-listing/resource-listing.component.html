<app-toaster #toaster></app-toaster>
<app-loader *ngIf="loading" type="pulse" size="lg" color="primary" message="Loading..." [overlay]="true"
    [fullScreen]="true" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999;">
</app-loader>

<div class="kt-portlet kt-portlet--mobile">
    <div class="kt-portlet__head kt-portlet__head--lg">
        <div class="kt-portlet__head-label">
            <span class="kt-portlet__head-icon">
                <i class="kt-font-dark flaticon-layers"></i>
            </span>
            <h3 class="kt-portlet__head-title">
                Resource Management
            </h3>
        </div>
        <div class="kt-portlet__head-toolbar">
            <div class="kt-portlet__head-wrapper">
                <button (click)="onAddResource()" class="btn btn-dark btn-icon-sm">
                    <i class="la la-plus"></i> New Resource
                </button>
            </div>
        </div>
    </div>
    <div class="kt-portlet__body">
        <div class="row">
            <div class="col-sm-12">
                <table class="table table-striped- table-bordered table-hover">
                    <thead>
                        <tr>
                            <th>Module</th>
                            <th>Resource Name</th>
                            <th>Version</th>
                            <th>Auth Required</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let res of pagination.paginatedItems">
                            <td>{{ res.module?.name }}</td>
                            <td>{{ res.resourceName }}</td>
                            <td>{{ res.version }}</td>
                            <td>
                                <span class="kt-badge kt-badge--inline kt-badge--pill"
                                    [ngClass]="res.isAuthRequired ? 'kt-badge--primary' : 'kt-badge--warning'">
                                    {{ res.isAuthRequired ? 'Required' : 'Optional' }}
                                </span>
                            </td>
                            <td>
                                <a (click)="onEditResource(res)" class="btn btn-sm btn-clean btn-icon btn-icon-md"
                                    title="Edit">
                                    <i class="la la-edit"></i>
                                </a>
                                <a (click)="onDeleteResource(res.id)" class="btn btn-sm btn-clean btn-icon btn-icon-md"
                                    title="Delete">
                                    <i class="la la-trash"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <div *ngIf="resources.length === 0" class="alert alert-dark" role="alert">
                    No resources found.
                </div>
            </div>
        </div>
    </div>
</div>

<app-delete-popup [show]="isDeletePopupOpen" title="Delete Resource"
    message="Are you sure you want to delete this resource?" confirmText="Delete" (confirm)="onConfirmDelete()"
    (cancel)="onCancelDelete()">
</app-delete-popup>
