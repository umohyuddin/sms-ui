<app-toaster #toaster></app-toaster>
<app-loader *ngIf="isSaving" [overlay]="true"></app-loader>

<div class="kt-portlet">
    <div class="kt-portlet__head">
        <div class="kt-portlet__head-label">
            <h3 class="kt-portlet__head-title">
                {{ isEditMode ? 'Edit Resource' : 'Create Resource' }}
            </h3>
        </div>
    </div>

    <form class="kt-form" [formGroup]="resourceForm" (ngSubmit)="onSubmit()">
        <div class="kt-portlet__body">
            <div class="form-group row">
                <div class="col-lg-6">
                    <label>Module:</label>
                    <select class="form-control" formControlName="moduleId">
                        <option value="">Select a Module</option>
                        <option *ngFor="let mod of modules" [value]="mod.id">{{ mod.name }}</option>
                    </select>
                </div>
                <div class="col-lg-6">
                    <label>Resource Name:</label>
                    <input type="text" class="form-control" formControlName="resourceName"
                        placeholder="e.g., Student Management">
                </div>
            </div>
            <div class="form-group row">
                <div class="col-lg-6">
                    <label>Version:</label>
                    <input type="text" class="form-control" formControlName="version">
                </div>
                <div class="col-lg-6 kt-padding-t-30">
                    <label class="kt-checkbox kt-margin-r-20">
                        <input type="checkbox" formControlName="isAuthRequired"> Auth Required
                        <span></span>
                    </label>
                    <label class="kt-checkbox">
                        <input type="checkbox" formControlName="isActive"> Active
                        <span></span>
                    </label>
                </div>
            </div>
            <div class="form-group row">
                <div class="col-lg-12">
                    <label>Description:</label>
                    <textarea class="form-control" formControlName="description" rows="3"></textarea>
                </div>
            </div>
        </div>
        <div class="kt-portlet__foot">
            <div class="kt-form__actions">
                <button type="submit" class="btn btn-dark mr-2">Save</button>
                <button type="button" (click)="onCancel()" class="btn btn-secondary">Cancel</button>
            </div>
        </div>
    </form>
</div>
