<div class="kt-portlet">
    <div class="kt-portlet__head">
        <div class="kt-portlet__head-label">
            <h3 class="kt-portlet__head-title">
                {{ isEditMode ? 'Update Weightage Details' : 'Add New Weightage' }}
            </h3>
        </div>
    </div>

    <form class="kt-form kt-form--label-right" [formGroup]="createForm" (ngSubmit)="onSubmit()">
        <div class="kt-portlet__body">
            <h4>Weightage Selection</h4>

            <div class="form-group row kt-margin-t-20">
                <label class="col-lg-1 col-form-label required">Campus:</label>
                <div class="col-lg-3">
                    <select class="form-control" formControlName="campusId" (change)="onCampusChange()"
                        [class.is-invalid]="createForm.get('campusId')?.touched && createForm.get('campusId')?.invalid">
                        <option value="">Select Campus</option>
                        <option *ngFor="let campus of campuses" [value]="campus.id">{{ campus.name }}</option>
                    </select>
                </div>

                <label class="col-lg-1 col-form-label required">Standard:</label>
                <div class="col-lg-3">
                    <select class="form-control" formControlName="standardId" (change)="onStandardChange()"
                        [class.is-invalid]="createForm.get('standardId')?.touched && createForm.get('standardId')?.invalid">
                        <option value="">Select Standard</option>
                        <option *ngFor="let std of standards" [value]="std.id">{{ std.standardName }}</option>
                    </select>
                </div>

                <label class="col-lg-1 col-form-label required">Exam Term:</label>
                <div class="col-lg-3">
                    <select class="form-control" formControlName="examTermId"
                        [class.is-invalid]="createForm.get('examTermId')?.touched && createForm.get('examTermId')?.invalid">
                        <option value="">Select Exam Term</option>
                        <option *ngFor="let term of examTerms" [value]="term.id">{{ term.termName }}</option>
                    </select>
                </div>
            </div>

            <div class="kt-separator kt-separator--border-dashed kt-separator--space-lg kt-separator--portlet-fit">
            </div>

            <h4 class="kt-margin-b-20">Subject Weightages Matrix</h4>

            <div class="row">
                <div class="col-lg-12">
                    <div *ngIf="weightages.length > 0; else noSubjects">
                        <table class="table table-striped table-bordered table-hover">
                            <thead>
                                <tr>
                                    <th>Subject Name</th>
                                    <th style="width: 200px;">Weightage (%)</th>
                                    <th style="width: 100px;">Status</th>
                                </tr>
                            </thead>
                            <tbody formArrayName="weightages">
                                <tr *ngFor="let w of weightages.controls; let i = index" [formGroupName]="i">
                                    <td class="align-middle">
                                        {{ w.get('subjectName')?.value }}
                                    </td>
                                    <td>
                                        <input type="number" class="form-control" placeholder="0"
                                            formControlName="weightPercentage"
                                            [class.is-invalid]="w.get('weightPercentage')?.touched && w.get('weightPercentage')?.invalid">
                                    </td>
                                    <td class="text-center">
                                        <label
                                            class="kt-checkbox kt-checkbox--single kt-checkbox--all kt-checkbox--solid mt-2">
                                            <input type="checkbox" formControlName="active">
                                            <span></span>
                                        </label>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <ng-template #noSubjects>
                        <div class="alert alert-secondary" role="alert">
                            <div class="alert-icon"><i class="flaticon-questions-circular-button"></i></div>
                            <div class="alert-text">Please select Campus and Standard to load subjects.</div>
                        </div>
                    </ng-template>
                </div>
            </div>
        </div>

        <div class="kt-portlet__foot">
            <div class="kt-form__actions">
                <div class="row">
                    <div class="col-lg-2"></div>
                    <div class="col-lg-10">
                        <button type="submit" class="btn btn-dark mr-2" [disabled]="isLoading">
                            <span *ngIf="isLoading" class="spinner-border spinner-border-sm" role="status"
                                aria-hidden="true"></span>
                            {{ isEditMode ? 'Update' : 'Save' }}
                        </button>
                        <button type="button" class="btn btn-danger" (click)="goBack()">Cancel</button>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
