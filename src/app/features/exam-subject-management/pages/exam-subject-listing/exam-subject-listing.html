<div class="kt-subheader kt-grid__item" id="kt_subheader">
    <div class="kt-container kt-container--fluid ">
        <div class="kt-subheader__main">
            <h3 class="kt-subheader__title">Manage Exam Subjects</h3>
        </div>
        <div class="kt-subheader__toolbar">
            <div class="kt-subheader__wrapper">
                <button type="button" class="btn btn-dark active" (click)="goToScheduleSubject()">
                    <i class="la la-plus"></i>
                    Schedule Subject
                </button>
            </div>
        </div>
    </div>
</div>

<app-exam-subject-listing-table [examId]="examId"></app-exam-subject-listing-table>
