<div class="kt-portlet kt-portlet--mobile">
    <div class="kt-portlet__head kt-portlet__head--lg">
        <div class="kt-portlet__head-label">
            <span class="kt-portlet__head-icon">
                <i class="kt-font-dark flaticon-squares"></i>
            </span>
            <h3 class="kt-portlet__head-title">
                Student Attendance Listing
            </h3>
        </div>
    </div>
    <div class="kt-portlet__body">
        <div class="table-responsive">
            <table class="table table-striped table-bordered table-hover">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Student Name</th>
                        <th>Roll Number</th>
                        <th>Exam</th>
                        <th>Subject</th>
                        <th>Status</th>
                        <th>Remarks</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let record of records; let i = index">
                        <td>{{ i + 1 }}</td>
                        <td>{{ record.studentName }}</td>
                        <td>{{ record.rollNumber }}</td>
                        <td>{{ record.examName }}</td>
                        <td>{{ record.subjectName }}</td>
                        <td>
                            <span class="kt-badge kt-badge--inline kt-badge--pill"
                                [ngClass]="record.isPresent ? 'kt-badge--success' : 'kt-badge--danger'">
                                {{ record.isPresent ? 'Present' : 'Absent' }}
                            </span>
                        </td>
                        <td>{{ record.remarks }}</td>
                    </tr>
                    <tr *ngIf="records.length === 0 && !isLoading">
                        <td colspan="7" class="text-center">No attendance records found.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
