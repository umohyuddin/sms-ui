<div class="kt-subheader kt-grid__item" id="kt_subheader">
    <div class="kt-container kt-container--fluid">
        <div class="kt-subheader__main">
            <h3 class="kt-subheader__title">Process Academic Results</h3>
            <span class="kt-subheader__separator kt-subheader__separator--v"></span>
        </div>
    </div>
</div>

<div class="kt-container kt-container--fluid kt-grid__item kt-grid__item--fluid">
    <div class="kt-portlet kt-portlet--mobile">
        <div class="kt-portlet__head kt-portlet__head--lg">
            <div class="kt-portlet__head-label">
                <span class="kt-portlet__head-icon">
                    <i class="kt-font-dark flaticon-squares"></i>
                </span>
                <h3 class="kt-portlet__head-title">
                    Run Result Calculations
                </h3>
            </div>
        </div>
        <div class="kt-portlet__body">
            <div class="row mb-5">
                <div class="col-md-3">
                    <label>Exam Term</label>
                    <select class="form-control" [(ngModel)]="filters.examTermId">
                        <option value="">Select Term</option>
                        <option *ngFor="let t of examTerms" [value]="t.id">{{ t.name }}</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label>Standard</label>
                    <select class="form-control" [(ngModel)]="filters.standardId">
                        <option value="">Select Standard</option>
                        <option *ngFor="let s of standards" [value]="s.id">{{ s.standardName }}</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label>Section</label>
                    <select class="form-control" [(ngModel)]="filters.sectionId">
                        <option value="">Select Section</option>
                        <option *ngFor="let s of sections" [value]="s.id">{{ s.sectionName }}</option>
                    </select>
                </div>
                <div class="col-md-3 d-flex align-items-end">
                    <button (click)="processResults()" class="btn btn-dark btn-block"
                        [disabled]="loading || !filters.examTermId">
                        <i class="la la-cogs"></i>
                        {{ loading ? 'Processing...' : 'Run Calculation' }}
                    </button>
                </div>
            </div>

            <div class="kt-separator kt-separator--border-dashed kt-separator--space-lg"></div>

            <div *ngIf="resultSummary" class="result-summary">
                <div class="row">
                    <div class="col-md-12">
                        <div class="alert alert-success" role="alert">
                            <div class="alert-icon"><i class="flaticon-interface-5"></i></div>
                            <div class="alert-text">Results processed successfully for <strong>{{
                                    resultSummary.studentCount }}</strong> students.</div>
                        </div>
                    </div>
                </div>

                <div id="kt_table_1_wrapper" class="dataTables_wrapper dt-bootstrap4 no-footer mt-4">
                    <div class="row">
                        <div class="col-sm-12">
                            <table class="table table-striped- table-bordered table-hover table-checkable dataTable">
                                <thead>
                                    <tr role="row">
                                        <th>Student Name</th>
                                        <th>Obtained Marks</th>
                                        <th>Percentage</th>
                                        <th>Grade</th>
                                        <th>Status</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr role="row" *ngFor="let r of resultSummary.records">
                                        <td><strong>{{ r.studentName }}</strong></td>
                                        <td>{{ r.obtainedMarks }} / {{ r.totalMarks }}</td>
                                        <td>{{ r.percentage }}%</td>
                                        <td>{{ r.grade }}</td>
                                        <td>
                                            <span
                                                [class]="r.status === 'PASS' ? 'kt-badge kt-badge--success kt-badge--inline' : 'kt-badge kt-badge--danger kt-badge--inline'">
                                                {{ r.status }}
                                            </span>
                                        </td>
                                        <td nowrap>
                                            <button class="btn btn-sm btn-label-brand btn-bold"
                                                (click)="viewReportCard(r)">
                                                <i class="la la-file-text"></i>
                                                Report Card
                                            </button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
