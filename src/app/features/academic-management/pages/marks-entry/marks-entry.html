<div class="kt-portlet">
    <div class="kt-portlet__head">
        <div class="kt-portlet__head-label">
            <h3 class="kt-portlet__head-title">Bulk Marks Entry</h3>
        </div>
    </div>
    <div class="kt-portlet__body">
        <div class="row mb-5">
            <div class="col-md-6">
                <h5>Subject: <strong>{{ subjectName }}</strong> | Max Marks: <strong>{{ maxMarks }}</strong></h5>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-bordered table-hover marks-table">
                <thead class="thead-light">
                    <tr>
                        <th>Roll No</th>
                        <th>Student Name</th>
                        <th class="text-center w-20">Obtained Marks</th>
                        <th class="text-center w-10">Absent?</th>
                        <th>Remarks</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let s of markSheet">
                        <td>{{ s.rollNo }}</td>
                        <td>{{ s.studentName }}</td>
                        <td>
                            <input type="number" class="form-control text-center" [(ngModel)]="s.obtainedMarks"
                                [disabled]="s.isAbsent" [max]="maxMarks">
                        </td>
                        <td class="text-center">
                            <label class="kt-checkbox kt-checkbox--single kt-checkbox--danger">
                                <input type="checkbox" [(ngModel)]="s.isAbsent">
                                <span></span>
                            </label>
                        </td>
                        <td>
                            <input type="text" class="form-control" [(ngModel)]="s.remarks" placeholder="Optional">
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div class="kt-portlet__foot text-right">
        <button (click)="saveMarks()" class="btn btn-success" [disabled]="loading">
            {{ loading ? 'Saving...' : 'Submit Mark Sheet' }}
        </button>
    </div>
</div>
