<div class="kt-subheader kt-grid__item" id="kt_subheader">
  <div class="kt-container kt-container--fluid">
    <div class="kt-subheader__main">
      <h3 class="kt-subheader__title">Manage Subject Groups</h3>
      <span class="kt-subheader__separator kt-subheader__separator--v"></span>
    </div>
    <div class="kt-subheader__toolbar">
      <div class="kt-subheader__wrapper">
      </div>
    </div>
  </div>
</div>

<div class="kt-portlet">
  <div class="kt-portlet__head">
    <div class="kt-portlet__head-label">
      <h3 class="kt-portlet__head-title">
        {{ isEdit ? 'Update Subject Group Details' : 'Add New Subject Group' }}
      </h3>
    </div>
  </div>

  <!--begin::Form-->
  <form class="kt-form kt-form--label-right" [formGroup]="groupForm" (ngSubmit)="onSubmit()">
    <div class="kt-portlet__body">
      <h4 class="kt-margin-b-20">Subject Group Information</h4>
      <div class="form-group row form-group-marginless">
        <label class="col-lg-1 col-form-label required">Group Name:</label>
        <div class="col-lg-3">
          <input type="text" class="form-control" placeholder="Enter group name" formControlName="name"
            [class.is-invalid]="groupForm.get('name')?.invalid && (groupForm.get('name')?.touched || groupForm.get('name')?.dirty)"
            [class.is-valid]="groupForm.get('name')?.valid && (groupForm.get('name')?.touched || groupForm.get('name')?.dirty)">
          <span class="form-text text-muted">Please enter group name</span>
          <span class="invalid-feedback" *ngIf="groupForm.get('name')?.invalid && (groupForm.get('name')?.touched || groupForm.get('name')?.dirty)">
            Group name is required
          </span>
        </div>

        <label class="col-lg-1 col-form-label required">Code:</label>
        <div class="col-lg-3">
          <input type="text" class="form-control" placeholder="Enter group code" formControlName="code"
            [class.is-invalid]="groupForm.get('code')?.invalid && (groupForm.get('code')?.touched || groupForm.get('code')?.dirty)"
            [class.is-valid]="groupForm.get('code')?.valid && (groupForm.get('code')?.touched || groupForm.get('code')?.dirty)">
          <span class="form-text text-muted">Please enter group code</span>
          <span class="invalid-feedback" *ngIf="groupForm.get('code')?.invalid && (groupForm.get('code')?.touched || groupForm.get('code')?.dirty)">
            Group code is required
          </span>
        </div>

        <label class="col-lg-1 col-form-label">Status:</label>
        <div class="col-lg-3">
          <label class="kt-checkbox kt-margin-t-10">
            <input type="checkbox" formControlName="isActive"> Is Active
            <span></span>
          </label>
        </div>
      </div>

      <div class="form-group row form-group-marginless kt-margin-t-20">
        <label class="col-lg-1 col-form-label">Description:</label>
        <div class="col-lg-11">
          <textarea class="form-control" formControlName="description" rows="3" placeholder="Enter description"></textarea>
          <span class="form-text text-muted">Please enter description (optional)</span>
        </div>
      </div>
    </div>

    <div class="kt-portlet__foot">
      <div class="kt-form__actions">
        <div class="row">
          <div class="col-lg-12 text-right">
            <button type="submit" class="btn btn-dark mr-2" [disabled]="groupForm.invalid || loading">
              {{ loading ? 'Saving...' : 'Submit' }}
            </button>
            <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
          </div>
        </div>
      </div>
    </div>
  </form>
</div>
