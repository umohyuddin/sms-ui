<div class="kt-subheader kt-grid__item" id="kt_subheader">
    <div class="kt-container kt-container--fluid">
        <div class="kt-subheader__main">
            <h3 class="kt-subheader__title">Section Timetable</h3>
            <span class="kt-subheader__separator kt-subheader__separator--v"></span>
        </div>
    </div>
</div>

<div class="kt-container kt-container--fluid kt-grid__item kt-grid__item--fluid">
    <div class="kt-portlet kt-portlet--mobile">
        <div class="kt-portlet__head kt-portlet__head--lg">
            <div class="kt-portlet__head-label">
                <span class="kt-portlet__head-icon">
                    <i class="kt-font-dark flaticon-calendar-1"></i>
                </span>
                <h3 class="kt-portlet__head-title">
                    Timetable Grid
                </h3>
            </div>
        </div>
        <div class="kt-portlet__body">
            <div class="row mb-5">
                <div class="col-md-4">
                    <label>Section</label>
                    <select class="form-control" [(ngModel)]="filters.sectionId" (change)="loadTimetable()">
                        <option value="">Select Section</option>
                        <option *ngFor="let s of sections" [value]="s.id">{{ s.sectionName }}</option>
                    </select>
                </div>
            </div>

            <div class="table-responsive" *ngIf="filters.sectionId">
                <table class="table table-bordered table-hover timetable-grid table-checkable">
                    <thead class="thead-light">
                        <tr>
                            <th>Time / Day</th>
                            <th *ngFor="let day of days">{{ day }}</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let slot of timeSlots">
                            <td class="time-label"><strong>{{ slot.label }}</strong></td>
                            <td *ngFor="let day of days" (click)="onCellClick(day, slot)" class="timetable-cell">
                                <div *ngIf="getEntry(day, slot) as entry"
                                    class="entry-box text-center p-2 bg-label-brand">
                                    <div class="font-bold">{{ entry.subjectName }}</div>
                                    <div class="text-xs">{{ entry.teacherName }}</div>
                                    <div class="text-xs text-muted">{{ entry.room }}</div>
                                    <button (click)="deleteEntry(entry.id!, $event)"
                                        class="btn btn-xs btn-clean btn-icon delete-btn">
                                        <i class="la la-close text-danger"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="alert alert-dark mt-5" role="alert" *ngIf="!filters.sectionId">
                <div class="alert-icon"><i class="flaticon-info"></i></div>
                <div class="alert-text">Please select a section to view its timetable.</div>
            </div>
        </div>
    </div>
</div>
