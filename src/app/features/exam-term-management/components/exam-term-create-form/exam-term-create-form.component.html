<app-toaster #toaster></app-toaster>
<app-loader *ngIf="loading" type="pulse" size="lg" color="primary" message="Loading..." [overlay]="true"
    [fullScreen]="true" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999;">
</app-loader>

<div class="kt-portlet">
    <div class="kt-portlet__head">
        <div class="kt-portlet__head-label">
            <h3 class="kt-portlet__head-title">
                {{ isEdit ? 'Update Exam Term' : 'Add New Exam Term' }}
            </h3>
        </div>
    </div>

    <form class="kt-form kt-form--label-right" [formGroup]="examTermForm" (ngSubmit)="onSubmit()">
        <div class="kt-portlet__body">
            <h4 class="kt-margin-b-20">Exam Term Information</h4>
            <div class="form-group row form-group-marginless">
                <label class="col-lg-1 col-form-label required">Name:</label>
                <div class="col-lg-5">
                    <input type="text" class="form-control" placeholder="Enter exam term name" formControlName="name"
                        [class.is-invalid]="examTermForm.get('name')?.invalid && (examTermForm.get('name')?.touched || examTermForm.get('name')?.dirty)"
                        [class.is-valid]="examTermForm.get('name')?.valid && (examTermForm.get('name')?.touched || examTermForm.get('name')?.dirty)">
                    <span class="form-text text-muted">Please enter exam term name</span>
                    <span class="invalid-feedback">Name is required</span>
                </div>

                <label class="col-lg-1 col-form-label required">Sequence:</label>
                <div class="col-lg-5">
                    <input type="number" class="form-control" placeholder="Enter sequence number"
                        formControlName="sequenceNo"
                        [class.is-invalid]="examTermForm.get('sequenceNo')?.invalid && (examTermForm.get('sequenceNo')?.touched || examTermForm.get('sequenceNo')?.dirty)"
                        [class.is-valid]="examTermForm.get('sequenceNo')?.valid && (examTermForm.get('sequenceNo')?.touched || examTermForm.get('sequenceNo')?.dirty)">
                    <span class="form-text text-muted">Please enter sequence number</span>
                    <span class="invalid-feedback">Sequence is required</span>
                </div>
            </div>

            <!-- Academic Year Hidden for now since we use default 1 -->
            <input type="hidden" formControlName="academicYearId">

            <div class="form-group row form-group-marginless kt-margin-t-20">
                <label class="col-lg-1 col-form-label">Status:</label>
                <div class="col-lg-3">
                    <label class="kt-checkbox kt-margin-t-10">
                        <input type="checkbox" formControlName="active"> Is Active
                        <span></span>
                    </label>
                </div>
            </div>
        </div>

        <div class="kt-portlet__foot">
            <div class="kt-form__actions">
                <div class="row">
                    <div class="col-lg-12 text-right">
                        <button type="submit" class="btn btn-dark mr-2" [disabled]="examTermForm.invalid || loading">
                            {{ loading ? 'Saving...' : 'Submit' }}
                        </button>
                        <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
