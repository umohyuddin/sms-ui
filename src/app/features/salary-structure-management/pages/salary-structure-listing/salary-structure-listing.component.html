<div class="kt-subheader  kt-grid__item" id="kt_subheader">
  <div class="kt-container  kt-container--fluid ">
    <div class="kt-subheader__main">
      <h3 class="kt-subheader__title">Salary Structure</h3>
      <span class="kt-subheader__separator kt-subheader__separator--v"></span>

      <div class="kt-input-icon kt-input-icon--right kt-subheader__search kt-hidden">
        <input type="text" class="form-control" placeholder="Search order..." id="generalSearch">
        <span class="kt-input-icon__icon kt-input-icon__icon--right">
          <span><i class="flaticon2-search-1"></i></span>
        </span>
      </div>
    </div>
    <div class="kt-subheader__toolbar">
      <div class="kt-subheader__wrapper">
        <button type="button" class="btn btn-dark active" (click)="goToCreate()">
          <i class="la la-plus"></i>
          Add New Salary Structure</button>
      </div>
    </div>
  </div>
</div>

<app-page-sub-header [title]="'Salary Structure'" [buttonText]="'Add New Salary Structure'" [buttonIcon]="'la la-plus'" [buttonClass]="'btn btn-dark active'" (buttonClick)="goToCreate()">
</app-page-sub-header>
<app-salary-structure-listing-table></app-salary-structure-listing-table>
