<div class="kt-portlet kt-portlet--mobile">
    <div class="kt-portlet__head kt-portlet__head--lg">
        <div class="kt-portlet__head-label">
            <span class="kt-portlet__head-icon">
                <i class="kt-font-dark flaticon-squares"></i>
            </span>
            <h3 class="kt-portlet__head-title">
                Student Marks Listing
            </h3>
        </div>
    </div>
    <div class="kt-portlet__body">
        <div class="table-responsive">
            <table class="table table-striped table-bordered table-hover">
                <thead>
                    <tr>
                        <th>Student Name</th>
                        <th>Roll Number</th>
                        <th>Obtained Marks</th>
                        <th>Total Marks</th>
                        <th>Percentage</th>
                        <th>Remarks</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let m of marks">
                        <td>{{ m.studentName }}</td>
                        <td>{{ m.rollNumber }}</td>
                        <td>{{ m.obtainedMarks }}</td>
                        <td>{{ m.totalMarks }}</td>
                        <td>{{ (m.obtainedMarks / m.totalMarks) | percent }}</td>
                        <td>{{ m.remarks }}</td>
                    </tr>
                    <tr *ngIf="marks.length === 0 && !isLoading">
                        <td colspan="6" class="text-center">No marks data found.</td>
                    </tr>
                    <tr *ngIf="isLoading">
                        <td colspan="6" class="text-center">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
