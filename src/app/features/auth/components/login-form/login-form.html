
    <!--begin::Form-->
    <form class="kt-form" novalidate="novalidate" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
            <input class="form-control" type="text" placeholder="Email" name="email" autocomplete="off" formControlName="email">
        </div>
        <div class="form-group">
            <input class="form-control" type="password" placeholder="Password" name="password" formControlName="password">
        </div>

        <!--begin::Action-->
        <div class="kt-login__actions">
            <a href="#" class="kt-link kt-login__link-forgot">
                Forgot Password ?
            </a>
            <button id="kt_login_signin_submit" class="btn btn-primary btn-elevate kt-login__btn-primary" type="submit">Sign In</button>
        </div>

        <!--end::Action-->
    </form>

    <!--end::Form-->
