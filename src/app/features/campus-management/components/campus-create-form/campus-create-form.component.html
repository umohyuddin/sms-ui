<div class="kt-portlet">
  <div class="kt-portlet__head">
    <div class="kt-portlet__head-label">
      <h3 class="kt-portlet__head-title">
        Add New Campus
      </h3>
    </div>
  </div>

  <!--begin::Form-->
  <form class="kt-form kt-form--label-right" [formGroup]="createCampusForm" (ngSubmit)="onSubmit()">
    <div class="kt-portlet__body">
      <h4>Campus Information</h4>
      <div class="form-group row form-group-marginless kt-margin-t-20">
        <label class="col-lg-1 col-form-label">School:</label>
        <div class="col-lg-3">
          <select class="form-control" formControlName="instituteId">
            <option value="" disabled>Select School</option>
          </select>
          <span class="form-text text-muted">Please select School</span>
        </div>

        <label class="col-lg-1 col-form-label">Campus Name:</label>
        <div class="col-lg-3">
          <input type="text" class="form-control" placeholder="Campus name" formControlName="campusName">
          <span class="form-text text-muted">Please enter your Campus name</span>
        </div>
        <label class="col-lg-1 col-form-label">Campus Code:</label>
        <div class="col-lg-3">
          <input type="text" class="form-control" placeholder="Campus Code" formControlName="campusCode">
        </div>
      </div>
      <div class="form-group row form-group-marginless kt-margin-t-20">
        <label class="col-lg-1 col-form-label">Status:</label>
        <div class="col-lg-3">  
          <label class="kt-checkbox kt-margin-t-10">
            <input type="checkbox" formControlName="isActive"> Is Active
            <span></span>
          </label>
        </div>

      </div>
      <div class="kt-separator kt-separator--border-dashed kt-separator--space-lg kt-separator--portlet-fit"></div>
      <h4 class="kt-margin-b-20">Contact Information</h4>

      <div class="form-group row form-group-marginless">

        <label class="col-lg-1 col-form-label">Contact:</label>
        <div class="col-lg-3">
          <input type="tel" class="form-control" placeholder="Enter contact number" formControlName="contactNumber">
          <span class="form-text text-muted">Please enter your contact</span>
        </div>
        <label class="col-lg-1 col-form-label">Email:</label>
        <div class="col-lg-3">
          <div class="kt-input-icon">
            <input type="email" class="form-control" placeholder="Email" formControlName="email">

          </div>
          <span class="form-text text-muted">Please enter your Email</span>
        </div>
        <label class="col-lg-1 col-form-label">Website:</label>
        <div class="col-lg-3">
          <div class="kt-input-icon">
            <input type="url" class="form-control" placeholder="Enter your Website" formControlName="website">
          </div>
          <span class="form-text text-muted">Please enter your Website</span>
        </div>
      </div>
      <div class="kt-separator kt-separator--border-dashed kt-separator--space-lg kt-separator--portlet-fit"></div>
      <h4 class="kt-margin-b-20">Address Information</h4>
      <div class="form-group row">
        <label class="col-lg-1 col-form-label">Province:</label>
        <div class="col-lg-3">
          <select class="form-control" formControlName="provinceId">
            <option value='' selected>Select Province</option>
            @for (p of provinces; track p.id) {
            <option [value]="p.id">{{ p.name }}</option>
            }
          </select>
          <span class="form-text text-muted">Please enter your Porvince</span>
        </div>
        <label class="col-lg-1 col-form-label">City:</label>
        <div class="col-lg-3">
          <select class="form-control" formControlName="cityId">
            <option value=''>Select City</option>
            @for (c of cities; track c.id) {
            <option [value]="c.id">{{ c.name }}</option>
            }
          </select>
          <span class="form-text text-muted">Please Select your City</span>
        </div>
      </div>
      <div class="form-group row">
        <label class="col-lg-1 col-form-label">Address:</label>
        <div class="col-lg-11">
          <div class="kt-input-icon">
            <textarea class="form-control" id="exampleTextarea" rows="3" formControlName="address"></textarea>
          </div>
        </div>
      </div>
    </div>
    <div class="kt-portlet__foot">
      <div class="kt-form__actions">
        <div class="row">
          <div class="col-lg-5"></div>
          <div class="col-lg-7">
            <button type="submit" class="btn btn-dark mr-2">Submit</button>
            <button type="reset" class="btn btn-secondary">Cancel</button>
          </div>
        </div>
      </div>
    </div>
  </form>

  <!--end::Form-->
</div>
