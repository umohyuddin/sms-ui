<div [ngClass]="containerClasses" [style.position]="overlay ? 'relative' : 'static'">
  <!-- Spinner Loader (using theme's built-in spinner) -->
  <div *ngIf="type === 'spinner'" class="loader-content">
    <div [ngClass]="loaderClasses"></div>
    <div *ngIf="message" class="loader-message">{{ message }}</div>
  </div>

  <!-- Pulse Loader -->
  <div *ngIf="type === 'pulse'" class="loader-content">
    <div class="pulse-loader">
      <div class="pulse-dot" [style.animation-delay]="'0s'"></div>
      <div class="pulse-dot" [style.animation-delay]="'0.2s'"></div>
      <div class="pulse-dot" [style.animation-delay]="'0.4s'"></div>
    </div>
    <div *ngIf="message" class="loader-message">{{ message }}</div>
  </div>

  <!-- Dots Loader -->
  <div *ngIf="type === 'dots'" class="loader-content">
    <div class="dots-loader">
      <div class="dot" [style.animation-delay]="'0s'"></div>
      <div class="dot" [style.animation-delay]="'0.2s'"></div>
      <div class="dot" [style.animation-delay]="'0.4s'"></div>
    </div>
    <div *ngIf="message" class="loader-message">{{ message }}</div>
  </div>

  <!-- Ring Loader -->
  <div *ngIf="type === 'ring'" class="loader-content">
    <div class="ring-loader">
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
    </div>
    <div *ngIf="message" class="loader-message">{{ message }}</div>
  </div>

  <!-- Skeleton Loader -->
  <div *ngIf="type === 'skeleton'" class="skeleton-loader">
    <div *ngFor="let item of skeletonArray" class="skeleton-item">
      <div class="skeleton-avatar"></div>
      <div class="skeleton-content">
        <div class="skeleton-line skeleton-line--long"></div>
        <div class="skeleton-line skeleton-line--medium"></div>
        <div class="skeleton-line skeleton-line--short"></div>
      </div>
    </div>
  </div>
</div>
