<div class="kt-widget4__item">
  <div class="kt-widget4__pic kt-widget4__pic--icon">
    <img [src]="getFileIcon(doc.fileType)" alt="file icon" >
  </div>
  <a href="javascript:void(0)" class="kt-widget4__title" (click)="onDownload()">
    {{ doc.fileName }}
  </a>
  <div class="kt-widget4__tools">
    <button type="button" class="btn btn-outline-brand btn-elevate btn-icon" (click)="onDownload()">
      <i class="la la-cloud-download"></i>
    </button>
  </div>
</div>
