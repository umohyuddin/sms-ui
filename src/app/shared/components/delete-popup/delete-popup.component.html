<div class="modal fade" tabindex="-1" role="dialog" [class.show]="show" [style.display]="show ? 'block' : 'none'" *ngIf="show">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">{{ title }}</h5>
        <button type="button" class="close" aria-label="Close" (click)="onCancel()"></button>
      </div>
      <div class="modal-body">
        <p>{{ message }}</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="onCancel()">{{ cancelText }}</button>
        <button type="button" class="btn btn-danger" (click)="onConfirm()">{{ confirmText }}</button>
      </div>
    </div>
  </div>
</div>
<div class="modal-backdrop fade" [class.show]="show" *ngIf="show"></div>
